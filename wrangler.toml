name = "cash-recon-worker"
main = "src/index.ts"
compatibility_date = "2024-09-25"
compatibility_flags = ["nodejs_compat"]
account_id = "ab2dba58727809ae8bf0a21edb5fe7b8"

# Browser Rendering — required for POST /api/admin/session/refresh (Puppeteer login).
# Docs: https://developers.cloudflare.com/browser-run/puppeteer/
# Free plan includes limited browser time; Paid unlocks higher limits.
browser = { binding = "BROWSER" }

# Do NOT set [limits].cpu_ms on Workers Free — deploy fails with code 100328.
# After upgrading to Workers Paid, you can add:
#   [limits]
#   cpu_ms = 300000
# so Puppeteer session refresh has enough CPU budget.

# Production / Default environment variables
[vars]
AMAZON_PROXY_BASE_URL = "https://www.amazonlogistics.eu"
BUSINESS_DAY_START_HOUR_IST = "5"
DATA_PROVIDER = "amazon"
AMAZON_LOGIN_STATION_CODE = "TIRC"
PUBLIC_WORKER_URL = "https://cash-recon-worker.withered-voice-1c40.workers.dev"
# Hourly CIA cron bursts stations via Ops Pulse when configured (always-on host).
# Must be always-on (Vercel). Render free spins down and background refresh stalls.
OPS_PULSE_URL = "https://ops.dropxlogistics.com"
# Optional: WORKFORCE_BASE_URL / WORKFORCE_COMPANY_ID (defaults in src/config.ts)

# CIA snapshots: every 2 hours 06:00–20:00 IST (00:30–14:30 UTC).
# Each kick starts/resumes today's run and bursts stations within the
# wall-time budget — no every-minute ticker (avoids idle CPU burn).
# Cash-TID snapshot: once daily at 23:00 IST (17:30 UTC) — resolves yesterday's
# open rows, captures tonight's CASH_AT_STATION backlog, purges past retention.
[triggers]
crons = ["30 0,2,4,6,8,10,12,14 * * *", "30 17 * * *"]

# Secrets (Set locally via .dev.vars or production via 'wrangler secret put')
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - ADMIN_API_KEY
# Optional bootstrap (prefer PUT /api/admin/credentials so they are editable):
# - AMAZON_PORTAL_EMAIL
# - AMAZON_PORTAL_PASSWORD
# Optional email alerts:
# - RESEND_API_KEY
# - OWNER_NOTIFICATION_EMAIL
# - NOTIFICATION_FROM_EMAIL

# Staging Environment
[env.staging]
browser = { binding = "BROWSER" }

[env.staging.vars]
AMAZON_PROXY_BASE_URL = "https://www.amazonlogistics.eu"
BUSINESS_DAY_START_HOUR_IST = "5"
DATA_PROVIDER = "amazon"
AMAZON_LOGIN_STATION_CODE = "TIRC"
PUBLIC_WORKER_URL = "https://cash-recon-worker.withered-voice-1c40.workers.dev"
OPS_PULSE_URL = "https://ops.dropxlogistics.com"

[env.staging.triggers]
crons = ["30 0,2,4,6,8,10,12,14 * * *", "30 17 * * *"]

# Staging Secrets (Set via 'wrangler secret put --env staging')
# - SUPABASE_URL
# - SUPABASE_SERVICE_ROLE_KEY
# - ADMIN_API_KEY
# - AMAZON_PORTAL_EMAIL
# - AMAZON_PORTAL_PASSWORD
# - RESEND_API_KEY
# - OWNER_NOTIFICATION_EMAIL
# - NOTIFICATION_FROM_EMAIL
